<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LikePunch</title>
<meta name="description" content="LikePunch">
<meta name="theme-color" content="#fbf8f0">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --paper: #fbf8f0;
    --ink: #0d1211;
    --muted: #5f625d;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem 1rem;
  }
  /* multiply lets the logo's off-white background merge with the page */
  .logo { width: min(420px, 80vw); height: auto; mix-blend-mode: multiply; }
  .note { margin: 1.5rem 0 0; font-size: 1.125rem; color: var(--muted); }
  footer {
    padding: 1.5rem;
    text-align: center;
    font-size: 0.9rem;
    color: var(--muted);
  }
  footer a { color: var(--ink); text-underline-offset: 3px; }
  footer a:focus-visible { outline: 3px solid #e63322; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <img class="logo" src="/logo.png" alt="LikePunch" width="700" height="594">
    <p class="note">Development stage...</p>
  </main>
  <footer>
    <p><a href="mailto:contact@domeniul-meu.com">likepunch.agency@gmail.com</a></p>
  </footer>
</body>
</html>
